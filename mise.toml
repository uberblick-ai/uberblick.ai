[tools]
node = "22"
python = "3.13"

# The build is standard-library Python; wrangler (Node) serves and deploys it.
[tasks.build]
description = "Build the site into out/"
run = "python3 build.py"

[tasks.serve]
description = "Build, then serve the site on http://localhost:8787 with the Worker's routing"
run = "python3 build.py && npx -y wrangler@4.152.0 dev"

[tasks.lint]
description = "Biome on the stylesheets and the Worker, then a wrangler dry run"
run = [
  "npx -y @biomejs/biome@2.5.9 lint --error-on-warnings .",
  "npx -y wrangler@4.152.0 deploy --dry-run",
]

[tasks.ci]
description = "What CI runs: build, then lint"
run = ["mise run build", "mise run lint"]

# A deploy from a laptop, after `npx wrangler login` once (DEPLOYING.md).
# Pushes to main deploy on their own through .github/workflows/deploy.yml.
[tasks.deploy]
description = "Build and deploy the Worker with your own Cloudflare login"
run = "python3 build.py && npx -y wrangler@4.152.0 deploy"

# The ablauf renderer and its playback controls, bundled for the browser from the
# published @uberblick/ablauf package (static/js/ablauf.js says which version).
[tasks.ablauf]
description = "Bundle @uberblick/ablauf's renderer and playback into static/js/ablauf.js"
run = '''
set -eu
version=0.3.0
tmp=$(mktemp -d)
trap 'rm -rf "$tmp"' EXIT
npm install --prefix "$tmp" --no-save --no-audit --no-fund "@uberblick/ablauf@$version" >/dev/null
printf 'export { render } from "@uberblick/ablauf";\nexport { mountPlayback } from "@uberblick/ablauf/playback";\n' > "$tmp/entry.mjs"
npx -y esbuild@0.27.2 "$tmp/entry.mjs" --bundle --format=esm --minify --target=es2022 --legal-comments=none \
  --banner:js="// @uberblick/ablauf $version (render and mountPlayback), bundled for the browser with \`mise run ablauf\`. Not edited by hand. MIT, see github.com/uberblick-ai/ablauf." \
  --outfile=static/js/ablauf.js
'''
