name: deploy

# Builds the site and deploys the Worker in wrangler.jsonc on every push to
# main. The first run creates the Worker; its routes on uberblick.ai are
# Terraform's in uberblick-infra. Run it by hand after a uberblick-2 release to
# refresh the home page's Recent changes.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency: deploy

jobs:
  deploy:
    name: build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # sitemap.xml dates each page by its last commit
      - run: python3 build.py
      # Repository secrets: CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN with
      # Account > Workers Scripts: Edit (DEPLOYING.md).
      - run: npx -y wrangler@4.152.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
